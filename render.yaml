# Blueprint de deploy no Render (free tier) para o piloto academico (TCC) do
# Bonding — um unico recurso, usando o runtime nativo Python do Render (sem
# Docker), para a tela de deploy mostrar o output do build/start ao vivo,
# incluindo tracebacks, sem precisar da aba "Shell" (paga):
#   - bonding-web: servico web (Daphne/ASGI, suporta WebSocket), plano free.
#
# Nao ha worker Celery nem Redis gerenciado (o free tier do Render nao tem
# essas opcoes gratuitas): USE_REDIS=false faz o cache e a camada de canais
# (Channels) rodarem em memoria do proprio processo, e as tasks do Celery
# (bonding/tasks.py, analise de conversa via Gemini) rodam sincronas/inline
# em vez de em background. Ver setup/settings.py (bloco "USE_REDIS").
#
# O Dockerfile/docker-compose.yml continuam no repo para rodar localmente
# com Redis de verdade, mas nao sao mais usados pelo Render.
#
# O banco de dados (Postgres) e o storage de midia continuam no Supabase ja
# configurado (DATABASE_URL / SUPABASE_*) — nao criamos um Postgres no Render
# para nao duplicar/migrar dados que ja existem.
#
# Depois de criar o Blueprint no Render (New > Blueprint, apontando para este
# repositorio), preencha manualmente no dashboard os valores marcados como
# "sync: false" abaixo (sao secrets, nao ficam neste arquivo).

envVarGroups:
  - name: bonding-shared-secrets
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false # ex.: bonding-web.onrender.com
      - key: ALLOWED_HOSTS_EXTRA
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL publica do frontend (Vercel, ex.: https://bonding.vercel.app)
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false # Supabase Postgres (ja usado em desenvolvimento)
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: AWS_REKOGNITION_ENABLED
        sync: false
      - key: VERIFICATION_PROVIDER
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: ABACATEPAY_API_KEY
        sync: false # nao usado em modo demo, mas mantenha preenchido se quiser voltar ao fluxo real
      - key: ABACATEPAY_WEBHOOK_TOKEN
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

services:
  - type: web
    name: bonding-web
    runtime: python
    plan: free
    healthCheckPath: /health/
    buildCommand: pip install --no-cache-dir -r requirements.txt
    envVars:
      - fromGroup: bonding-shared-secrets
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "false"
      - key: SECURITY_HARDENING
        value: "true"
      - key: PAYMENTS_DEMO_MODE
        value: "true" # piloto academico: planos premium sao ativados sem cobranca real
      - key: USE_REDIS
        value: "false" # free tier nao tem Redis/worker gerenciado gratuito
    startCommand: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p $PORT setup.asgi:application"
