services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bonding_web
    restart: no
    environment:
      SECRET_KEY: bonding-local-secret
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
      daphne -b 0.0.0.0 -p 8000 setup.asgi:application"

  db:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: bonding_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-bonding}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_NAME:-bonding}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bonding_redis
    restart: always
    ports:
      - "6379:6379"

  # Instancia local da Overpass API, recortada para a regiao de Sao Luis - MA
  # (raio de 100km ao redor de (-2.53, -44.3028), ver RADIUS_KM em
  # run_date_experiment.py). Usada no experimento do TCC (Secao 3.2) para
  # eliminar a dependencia de espelhos publicos compartilhados — ver
  # docs/overpass-local.md para como gerar ./osm_data/sao-luis.osm.bz2.
  overpass:
    profiles: ["overpass"]
    image: wiktorn/overpass-api
    container_name: bonding_overpass
    restart: unless-stopped
    environment:
      OVERPASS_MODE: init
      OVERPASS_PLANET_URL: file:///db/sao-luis.osm.bz2
      OVERPASS_META: "no"
      OVERPASS_USE_AREAS: "false"
      OVERPASS_STOP_AFTER_INIT: "false"
    volumes:
      - ./osm_data:/db
    ports:
      - "12345:80"

volumes:
  postgres_data:
